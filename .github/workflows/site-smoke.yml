name: Site QA

"on":
  pull_request:
    paths:
      - '**/*.html'
      - '**/*.js'
      - '**/*.css'
      - '**/*.xml'
      - 'robots.txt'
      - 'tests/**'
      - 'assets/**'
      - '.github/workflows/site-smoke.yml'
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.js'
      - '**/*.css'
      - '**/*.xml'
      - 'robots.txt'
      - 'tests/**'
      - 'assets/**'
      - '.github/workflows/site-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check locations.js
          node --check app.js
          node --check data.js
          node --check shop.js
          node --check lightbox.js
          node --check nav.js
          node --check tests/infrastructure.spec.js
          node --check tests/visual-qa.spec.js

      - name: Install browser test runner
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Reject legacy Commotion image references
        run: |
          if grep -R -E 'commotion-full\.png|assets/characters/commotion\.webp' --include='*.html' --include='*.js' --include='*.css' --include='*.md' --exclude-dir=.git .; then
            echo "Legacy Commotion image reference found."
            exit 1
          fi

      - name: Reject legacy Gila and Kincast image references
        run: |
          if grep -R -E 'gila-monster-full\.png|assets/characters/gila-monster\.webp|kincast-full\.png|Kincast\.png\.png|ChatGPT Image Sep 23, 2026, 09_21_01 PM\.png' --include='*.html' --include='*.js' --include='*.css' --exclude-dir=.git --exclude-dir=tests .; then
            echo "Legacy Gila or Kincast image reference found."
            exit 1
          fi

      - name: Reject legacy Aftermark and Agent Emerald upload references
        run: |
          if grep -R -E 'aftermark-full\.png|ChatGPT Image Oct 1, 2026, 07_57_' --include='*.html' --include='*.js' --include='*.css' --exclude-dir=.git --exclude-dir=tests --exclude-dir=source .; then
            echo "Legacy Aftermark filler or generic Agent Emerald upload reference found."
            exit 1
          fi

      - name: Start static site
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/oldroot-http.log 2>&1 &
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/locations.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/oldroot-http.log
          exit 1

      - name: Run website and infrastructure smoke tests
        run: npx playwright test tests/*.spec.js --reporter=line --workers=1

      - name: Upload visual QA captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oldroot-visual-qa
          path: artifacts/visual-qa
          if-no-files-found: ignore
          retention-days: 14
