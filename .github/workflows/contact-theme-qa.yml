name: Contact Theme QA

on:
  pull_request:
    paths:
      - 'contact.html'
      - 'brand.css'
      - 'site.css'
      - 'tests/contact-avocado.spec.js'
      - 'tests/sitewide-redesign.spec.js'
      - '.github/workflows/contact-theme-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contact-theme:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check site scripts
        run: node --check nav.js
      - name: Install browser test runner
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static preview
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/contact-theme-http.log 2>&1 &
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/contact.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/contact-theme-http.log
          exit 1
      - name: Verify contact styling and sitewide cache keys
        run: npx playwright test tests/contact-avocado.spec.js tests/sitewide-redesign.spec.js --reporter=line --workers=1
