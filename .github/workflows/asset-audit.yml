name: Asset build

on:
  push:
    branches:
      - feat/agent-emerald-aftermark-art

permissions:
  contents: write

jobs:
  build-assets:
    if: ${{ !contains(github.event.head_commit.message, '[asset-build]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Pillow
        run: python3 -m pip install --quiet pillow
      - name: Organize and optimize Agent Emerald and Aftermark art
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import shutil

          agent_sources = [
            ("ChatGPT Image Oct 1, 2026, 07_57_35 PM-1.png", "agent-emerald-source-01.png", "agent-emerald-registry.webp"),
            ("ChatGPT Image Oct 1, 2026, 07_57_35 PM-2.png", "agent-emerald-source-02.png", "agent-emerald-dossier-01.webp"),
            ("ChatGPT Image Oct 1, 2026, 07_57_36 PM-3.png", "agent-emerald-source-03.png", "agent-emerald-dossier-02.webp"),
            ("ChatGPT Image Oct 1, 2026, 07_57_36 PM-4.png", "agent-emerald-source-04.png", "agent-emerald-dossier-03.webp"),
            ("ChatGPT Image Oct 1, 2026, 07_57_37 PM-5.png", "agent-emerald-source-05.png", "agent-emerald-dossier-04.webp"),
            ("ChatGPT Image Oct 1, 2026, 07_57_38 PM-6.png", "agent-emerald-source-06.png", "agent-emerald-primary.webp"),
            ("ChatGPT Image Oct 1, 2026, 07_57_38 PM-7.png", "agent-emerald-source-07.png", "agent-emerald-dossier-05.webp"),
            ("ChatGPT Image Oct 1, 2026, 07_57_39 PM-8.png", "agent-emerald-source-08.png", "agent-emerald-featured.webp"),
          ]
          aftermark_sources = [
            ("assets/characters/Aftermark Over Santurce at Sunrise.png", "aftermark-cover-source.png", "aftermark-cover.webp"),
            ("assets/characters/Aftermark Surveys Santurce Rooftop Route.png", "aftermark-primary-source.png", "aftermark-primary.webp"),
            ("assets/characters/Aftermark vaults a San Juan stairwell.png", "aftermark-dossier-01-source.png", "aftermark-dossier-01.webp"),
            ("assets/characters/Aftermark's Invisible Counterpunch.png", "aftermark-location-cover-source.png", "aftermark-location-cover.webp"),
            ("assets/characters/Aftermark’s Rainy San Juan Counter.png", "aftermark-opi-cover-source.png", "aftermark-opi-cover.webp"),
            ("assets/characters/Aftermark’s rainy rooftop leap.png", "aftermark-featured-source.png", "aftermark-featured.webp"),
            ("assets/characters/Aftermark’s stored strike.png", "aftermark-registry-source.png", "aftermark-registry.webp"),
          ]

          def process(rows, dest_root):
              source_dir = dest_root / "source"
              source_dir.mkdir(parents=True, exist_ok=True)
              dest_root.mkdir(parents=True, exist_ok=True)
              for src_name, source_name, webp_name in rows:
                  src = Path(src_name)
                  if not src.exists():
                      raise SystemExit(f"Missing source: {src}")
                  organized = source_dir / source_name
                  if src.resolve() != organized.resolve():
                      shutil.move(str(src), str(organized))
                  with Image.open(organized) as im:
                      out = im.convert("RGB")
                      out.save(dest_root / webp_name, "WEBP", quality=84, method=6)

          process(agent_sources, Path("assets/characters/agent-emerald"))
          process(aftermark_sources, Path("assets/characters/aftermark"))

          duplicate = Path("assets/ChatGPT Image Oct 1, 2026, 07_57_39 PM-8.png")
          if duplicate.exists():
              duplicate.unlink()
          filler = Path("assets/characters/aftermark-full.png")
          if filler.exists():
              filler.unlink()
          PY
      - name: Commit optimized assets
        run: |
          git config user.name "OldRootHQ Asset Build"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "[asset-build] Organize and optimize Agent Emerald and Aftermark art"
          git push origin HEAD:${GITHUB_REF_NAME}
