name: Issue One Visual Review

on:
  pull_request:
    paths:
      - 'index.html'
      - 'living-comic-home.css'
      - 'assets/branding/issue-01-graffiti-accents.svg'
      - 'tests/issue-graffiti.spec.js'
      - '.github/workflows/issue-graffiti-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Set up browser capture
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Start site locally
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/oldroot-issue-server.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/oldroot-issue-server.log
          exit 1
      - name: Capture desktop and mobile graffiti artwork
        run: npx playwright test tests/issue-graffiti.spec.js --workers=1 --reporter=line
      - name: Save actual website previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oldroot-issue-one-creator-preview
          path: artifacts/issue-one-review/
          if-no-files-found: ignore
          retention-days: 14
